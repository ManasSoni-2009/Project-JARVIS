<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Defs for filters and gradients -->
  <defs>
    <!-- Cyan glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Bright inner glow -->
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#c4f8ff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#00d2ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0088cc" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background / Base Plate -->
  <circle cx="100" cy="100" r="90" fill="#0b1114" stroke="#1f2d33" stroke-width="4" />

  <!-- Outer rotating dashed ring -->
  <g transform="translate(100 100)">
    <circle cx="0" cy="0" r="75" fill="none" stroke="#00d2ff" stroke-width="3" stroke-dasharray="10 10" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Middle segmented ring -->
  <g transform="translate(100 100)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#00aaff" stroke-width="8" stroke-dasharray="30 15" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite" />
    </circle>
    <!-- Inner border of middle ring -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="#005577" stroke-width="1" />
    <circle cx="0" cy="0" r="64" fill="none" stroke="#005577" stroke-width="1" />
  </g>

  <!-- Inner rotating gear/spokes -->
  <g transform="translate(100 100)">
    <path d="M 0 -45 L 5 -35 L -5 -35 Z" fill="#00d2ff" filter="url(#innerGlow)" />
    <path d="M 0 45 L 5 35 L -5 35 Z" fill="#00d2ff" filter="url(#innerGlow)" />
    <path d="M -45 0 L -35 5 L -35 -5 Z" fill="#00d2ff" filter="url(#innerGlow)" />
    <path d="M 45 0 L 35 5 L 35 -5 Z" fill="#00d2ff" filter="url(#innerGlow)" />
    <path d="M -32 -32 L -25 -25 L -20 -30 Z" fill="#00d2ff" opacity="0.6" />
    <path d="M 32 32 L 25 25 L 20 30 Z" fill="#00d2ff" opacity="0.6" />
    <path d="M -32 32 L -25 25 L -30 20 Z" fill="#00d2ff" opacity="0.6" />
    <path d="M 32 -32 L 25 -25 L 30 -20 Z" fill="#00d2ff" opacity="0.6" />

    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
  </g>

  <!-- Core Pulse -->
  <circle cx="100" cy="100" r="30" fill="url(#coreGlow)">
    <animate attributeName="r" values="28;33;28" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
  </circle>

  <circle cx="100" cy="100" r="15" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="r" values="14;16;14" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- High-tech crosshairs/HUD elements -->
  <path d="M 10 100 L 25 100" stroke="#00d2ff" stroke-width="2" opacity="0.5" />
  <path d="M 190 100 L 175 100" stroke="#00d2ff" stroke-width="2" opacity="0.5" />
  <path d="M 100 10 L 100 25" stroke="#00d2ff" stroke-width="2" opacity="0.5" />
  <path d="M 100 190 L 100 175" stroke="#00d2ff" stroke-width="2" opacity="0.5" />

</svg>
